<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sinal SP Marcenaria — Gestão de Custos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Segoe UI',sans-serif;background:#f2f2f2;color:#2c2c2c;min-height:100vh}
input,select{width:100%;padding:8px 11px;background:#fff;border:1px solid #d0d0d0;border-radius:6px;color:#2c2c2c;font-size:12px;font-family:inherit;outline:none;box-sizing:border-box;transition:border .15s}
input:focus,select:focus{border-color:#555;box-shadow:0 0 0 3px rgba(0,0,0,.06)}
input.upper{text-transform:uppercase}
button{font-family:inherit;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:9px 10px;text-align:left;color:#666;font-size:10px;font-weight:600;letter-spacing:.8px;border-bottom:2px solid #e4e4e4;background:#fafafa;text-transform:uppercase}
td{padding:10px;border-bottom:1px solid #ececec;color:#2c2c2c}
tr:hover td{background:#f9f9f9}
.card{background:#fff;border:1px solid #e4e4e4;border-radius:10px;padding:20px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card-title{font-size:10px;font-weight:700;color:#777;letter-spacing:1.5px;margin-bottom:16px;text-transform:uppercase}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.label{display:block;font-size:10px;font-weight:600;color:#666;margin-bottom:5px;letter-spacing:.8px;text-transform:uppercase}
.btn{padding:9px 18px;border-radius:7px;font-size:12px;font-weight:600;border:1px solid #d0d0d0;color:#444;background:#fff;transition:all .15s}
.btn:hover{background:#f5f5f5;border-color:#bbb}
.btn-primary{background:#2c2c2c;border-color:#2c2c2c;color:#fff}
.btn-primary:hover{background:#444;border-color:#444}
.btn-ghost{background:transparent;border-color:#d8d8d8;color:#666}
.btn-ghost:hover{background:#f5f5f5}
.btn-danger{background:#fff;border-color:#dbb;color:#a33}
.btn-danger:hover{background:#fdf5f5}
.btn-sm{padding:5px 12px;font-size:11px;border-radius:6px}
.btn-icon{width:30px;height:30px;background:#f5f5f5;border:1px solid #e0e0e0;border-radius:6px;color:#666;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:all .15s}
.btn-icon:hover{background:#ebebeb;border-color:#ccc}
.btn-icon.danger{background:#fdf5f5;border-color:#dbb;color:#a33}
.btn-icon.danger:hover{background:#fae8e8}
.tag{background:#efefef;color:#666;border-radius:4px;padding:2px 8px;font-size:10px;font-weight:500;border:1px solid #e2e2e2}
.pill{padding:4px 12px;border-radius:20px;border:1px solid #ddd;background:#fff;color:#666;font-size:11px;font-family:inherit;cursor:pointer;transition:all .15s}
.pill:hover{border-color:#666;color:#444}
.pill.active{border-color:#2c2c2c;background:#2c2c2c;color:#fff}
.info-box{background:#f7f7f7;border-radius:8px;padding:14px;border:1px solid #ebebeb}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.flex{display:flex;gap:8px;align-items:center}
.flex-col{display:flex;flex-direction:column;gap:14px}
.empty{text-align:center;padding:32px 0;color:#999;font-size:13px}
.hidden{display:none!important}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f2}
#header{background:#fff;border-bottom:1px solid #e4e4e4;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.04)}
#tabbar{display:flex;background:#fff;border-bottom:1px solid #e4e4e4;overflow-x:auto;padding:0 16px}
.tab-btn{padding:12px 20px;border:none;border-bottom:2px solid transparent;background:none;color:#777;font-size:12px;font-family:inherit;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .15s}
.tab-btn:hover{color:#555}
.tab-btn.active{border-bottom-color:#2c2c2c;color:#2c2c2c;font-weight:700}
#content{padding:20px 16px;max-width:1000px;margin:0 auto}
.comp-layout{display:flex;gap:14px}
.comp-sidebar{width:200px;flex-shrink:0}
.comp-item{padding:12px 14px;border-radius:8px;cursor:pointer;border:1px solid #e4e4e4;background:#fff;margin-bottom:6px;transition:all .15s}
.comp-item:hover{border-color:#bbb;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.comp-item.active{border-color:#2c2c2c;background:#2c2c2c;color:#fff}
#saving-ind{position:fixed;bottom:16px;right:16px;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:8px 16px;font-size:11px;color:#666;display:none;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tog{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.tog input{opacity:0;width:0;height:0;position:absolute}
.tog-track{width:36px;height:20px;background:#d8d8d8;border-radius:10px;transition:.2s;flex-shrink:0;position:relative}
.tog input:checked + .tog-track{background:#2c2c2c}
.tog-track::after{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog input:checked + .tog-track::after{transform:translateX(16px)}
.tog-lbl{font-size:11px;color:#666}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal-box{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:24px;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,.10)}
</style>
</head>

let db=null, state=JSON.parse(JSON.stringify(DEF)), currentUser=null, currentTab=0;
let saveTimer=null, ignoreRemote=false;

function getCfg(){try{return JSON.parse(localStorage.getItem('marc_fb_cfg'));}catch(e){return null;}}
function resetFb(){localStorage.removeItem('marc_fb_cfg');location.reload();}
function conectarFirebase(){
  const cfg={apiKey:ge("fb-apiKey").value.trim(),authDomain:ge("fb-authDomain").value.trim(),databaseURL:ge("fb-databaseURL").value.trim(),projectId:ge("fb-projectId").value.trim()};
  if(!cfg.apiKey||!cfg.databaseURL||!cfg.projectId){showFbErr("Preencha todos os campos.");return;}
  localStorage.setItem('marc_fb_cfg',JSON.stringify(cfg));initFb(cfg);
}
function showFbErr(msg){const el=ge("fb-err");if(el){el.textContent=msg;el.style.display="block";}}
function initFb(cfg){
  try{
    if(firebase.apps.length)firebase.app().delete().catch(()=>{});
    firebase.initializeApp(cfg);db=firebase.database();
    db.ref('marc_data').once('value').then(snap=>{
      if(snap.exists())state=merge(snap.val());
      else db.ref('marc_data').set(state);
      ge("fb-overlay").style.display="none";
      ge("login-screen").classList.remove("hidden");
      db.ref('marc_data').on('value',snap=>{
        if(!snap.exists()||ignoreRemote)return;
        state=merge(snap.val());
        if(currentUser&&!ge("app").classList.contains("hidden"))renderTab();
      });
    }).catch(err=>{showFbErr("Erro: "+err.message);});
  }catch(err){showFbErr("Config inválida: "+err.message);}
}
function merge(r){
  const d=JSON.parse(JSON.stringify(DEF));
  if(r.users)d.users=r.users;
  if(r.catMat)d.catMat=r.catMat;
  if(r.catFer)d.catFer=r.catFer;
  if(r.catComp)d.catComp=r.catComp;
  if(r.materiais)d.materiais=r.materiais;
  if(r.ferragens)d.ferragens=r.ferragens;
  if(r.comps)d.comps=r.comps;
  if(r.config)d.config=Object.assign(d.config,r.config);
  return d;
}
function save(){
  if(!db)return;
  ignoreRemote=true;clearTimeout(saveTimer);
  ge("saving-ind").style.display="block";
  saveTimer=setTimeout(()=>{
    db.ref('marc_data').set(state).then(()=>{ge("saving-ind").style.display="none";setTimeout(()=>{ignoreRemote=false;},500);}).catch(()=>{ge("saving-ind").style.display="none";ignoreRemote=false;});
  },500);
}
async function sincronizar(){
  if(!db)return;

  // Monta preços com faces detalhadas por composição
  const prices=state.comps.map(c=>{
    const{final}=calcPreco(c);

    // Monta faces com custo por m² de cada material
    const faces=(c.faces||[]).map(f=>{
      const mat=state.materiais.find(m=>String(m.id)===String(f.matId));
      const custoM2=mat?Math.round(custoMat(mat)*100)/100:0;
      return {
        nome:f.nome,
        eixo:f.eixo,
        matId:f.matId,
        matNome:mat?mat.nome:'',
        custoM2,
        ativoDescricao:f.ativoDescricao!==false
      };
    });

    // Monta ferragens com quantidade e preço por unidade
    const ferragens=(c.ferragens||[]).map(li=>{
      const fer=state.ferragens.find(x=>String(x.id)===String(li.ferId));
      return {
        nome:fer?fer.nome:'',
        precoUn:fer?Math.round(custoFer(fer)*100)/100:0,
        qtd:li.qtd,
        custoTotal:fer?Math.round(custoFer(fer)*li.qtd*100)/100:0,
        ativoDescricao:li.ativoDescricao!==false
      };
    });

    return {
      id:c.id,
      nome:c.nome,
      cat:c.catOrcamento||"Outros",
      preco:Math.round(final*100)/100,
      ativoDescricao:c.ativoDescricao!==false,
      // dimensões de referência
      dimLarg:c.dimLarg||800,
      dimAlt:c.dimAlt||1800,
      dimProf:c.dimProf||600,
      // faces com material e custo/m²
      faces,
      // ferragens com custo/m²
      ferragens,
      // parâmetros de custo
      horasM2:c.horasM2||0,
      custoMaoObraHora:Math.round(calcMaoObra()*100)/100,
      custoOverheadHora:Math.round(calcOverheadHora()*100)/100,
      overheadPerc:state.config.overheadPerc||0,
      impostoPerc:state.config.impostoVendaPerc||0,
      margemPerc:c.margemLucroPerc||0
    };
  });

  const extras=state.ferragens.filter(f=>f.ativoOrcamento!==false).map(f=>({id:f.id,nome:f.nome,preco:Math.round(custoFer(f)*100)/100}));

  await db.ref('marc_prices').set(prices);
  await db.ref('marc_extras').set(extras);
  const sm=ge("sync-msg");sm.textContent="✅ Sincronizado!";sm.style.display="inline";
  setTimeout(()=>{sm.style.display="none";},4000);
}

// ── UTILS ───────────────────────────────────────────────────────
const fmt=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pct=v=>`${(+v||0).toFixed(1)}%`;
const genId=()=>Date.now()+Math.random();
// custoMat definido em MATERIAIS abaixo
const custoFer=f=>f.custoCompra*(1+(f.margemPerc||0)/100);
const setorInfo=id=>SETORES.find(s=>s.id===id)||SETORES[0];
function ge(id){return document.getElementById(id);}
function h(el,html){el.innerHTML=html;}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function calcMaoObra(){
  // custo total por hora = soma(salario/horas) de todos os cargos
  return (state.config.maoObra||[]).reduce((a,m)=>a+(+m.salario||0)/(+m.horas||1),0);
}
function calcOverheadHora(){
  return (state.config.overhead||[]).reduce((a,o)=>a+(+o.mes||0)/(+o.horas||1),0);
}
function calcPreco(comp){
  const mats=state.materiais,fers=state.ferragens,cfg=state.config;
  const cm=(comp.materiais||[]).reduce((a,li)=>{const m=mats.find(x=>String(x.id)===String(li.matId));return a+(m?custoMat(m)*li.qtd:0);},0);
  const cf=(comp.ferragens||[]).reduce((a,li)=>{const f=fers.find(x=>String(x.id)===String(li.ferId));return a+(f?custoFer(f)*li.qtd:0);},0);
  const maoH=calcMaoObra();
  const mao=maoH*(comp.horasM2||0);
  const ovH=calcOverheadHora();
  const ov=ovH*(comp.horasM2||0);
  const sub=cm+cf+mao+ov;
  const comOv=sub*(1+(cfg.overheadPerc||0)/100);
  const comImp=comOv*(1+(cfg.impostoVendaPerc||0)/100);
  const final=comImp/(1-(comp.margemLucroPerc||0)/100);
  return{cm,cf,mao,ov,sub,comOv,comImp,final,maoH,ovH};
}

  ge(`cat-view-${i}`).style.display="block";
  ge(`cat-btns-${i}`).style.display="flex";

function salvarEdicaoCat(i){
  const novo=ge(`cat-edit-${i}`).value.trim().toUpperCase();
  if(!novo)return;
  const antigo=_catList[i];
  if(antigo!==novo){
    state.materiais.forEach(m=>{if(m.cat===antigo)m.cat=novo;});
    state.ferragens.forEach(f=>{if(f.cat===antigo)f.cat=novo;});
    _catList[i]=novo;
    save();
  }
  renderModalCatList();
}
function removerCat(i){
  const cat=_catList[i];
  const usadaMat=state.materiais.some(m=>m.cat===cat);
  const usadaFer=state.ferragens.some(f=>f.cat===cat);
  if(usadaMat||usadaFer){
    if(!confirm(`A categoria "${cat}" está em uso. Remover mesmo assim?`))return;
  }
  _catList.splice(i,1);
  save();
  renderModalCatList();
}
function confirmarNovaCategoria(){
  const nome=ge("modal-cat-input").value.trim().toUpperCase();
  if(!nome)return;
  if(!_catList.includes(nome)){_catList.push(nome);save();}
  ge("modal-cat-input").value="";
  renderModalCatList();
  setTimeout(()=>ge("modal-cat-input").focus(),50);
}

let _matTempTipo=null;
function onChangeTipoMat(val){
  // Salva dados atuais do formulário antes de re-renderizar
  _matTempTipo=val;
  // Preserva os valores já digitados
  const nome=ge("m-nome")?ge("m-nome").value:"";
  const cat=ge("m-cat")?ge("m-cat").value:"";
  const custo=ge("m-custo")?ge("m-custo").value:"";
  const perda=ge("m-perda")?ge("m-perda").value:"8";
  const marg=ge("m-marg")?ge("m-marg").value:"20";
  // Se estiver editando, atualiza o tipo temporariamente
  if(matEditId){
    state.materiais=state.materiais.map(m=>m.id===matEditId?{...m,tipo:val}:m);
  } else {
    // Novo material: guarda estado temporário
    window._matTemp={nome,cat,custo,perda,marg,tipo:val};
  }
  renderTab();
  // Restaura campos após re-render
  setTimeout(()=>{
    if(ge("m-nome")&&nome) ge("m-nome").value=nome;
    if(ge("m-cat")&&cat){const s=ge("m-cat");for(let o of s.options)if(o.value===cat){o.selected=true;break;}}
    if(ge("m-custo")&&custo) ge("m-custo").value=custo;
    if(ge("m-perda")&&perda) ge("m-perda").value=perda;
    if(ge("m-marg")&&marg) ge("m-marg").value=marg;
    updMP();
  },10);
}
function updMP(){
  const tipo=ge("m-tipo")?ge("m-tipo").value:"chapa";
  const preco=+ge("m-custo").value||0;
  const perda=+ge("m-perda").value||0;
  const marg=+ge("m-marg").value||0;
  if(tipo==="rolo"){
    const roloM=+ge("m-rolo-m").value||50;
    const custoM=preco/roloM;
    const final=custoM*(1+perda/100)*(1+marg/100);
    const unEl=ge("m-custo-un"); if(unEl) unEl.textContent=preco?fmt(custoM)+"/m":"—";
    const pEl=ge("m-prev"); if(pEl) pEl.textContent=preco?fmt(final)+"/m":"—";
  } else {
    const larg=+ge("m-chapa-larg").value||1850;
    const alt=+ge("m-chapa-alt").value||2750;
    const area=(larg/1000)*(alt/1000);
    const custoM2=preco/area;
    const final=custoM2*(1+perda/100)*(1+marg/100);
    const aEl=ge("m-area-chapa"); if(aEl) aEl.textContent=area.toFixed(4)+" m²";
    const unEl=ge("m-custo-un"); if(unEl) unEl.textContent=preco?fmt(custoM2)+"/m²":"—";
    const pEl=ge("m-prev"); if(pEl) pEl.textContent=preco?fmt(final)+"/m²":"—";
  }
}
function setMatFilter(cat){matFilter=cat;renderTab();}
function saveMat(){

  {tipo:"topo",      nome:"TOPO",        eixo:"lp", espMm:15},
  {tipo:"lateral",   nome:"LATERAL ESQ", eixo:"ph", espMm:15},
  {tipo:"lateral",   nome:"LATERAL DIR", eixo:"ph", espMm:15},
  {tipo:"traseira",  nome:"TRASEIRA",    eixo:"lh", espMm:6},

  {tipo:"custom",    nome:"PERSONALIZAR",eixo:"lh", espMm:15}

function areaFaceComp(face,dim){
  const l=dim.larg/1000, a=dim.alt/1000, p=dim.prof/1000;
  if(face.tipo==="travessa"||face.tipo==="prateleira"){
    const esp=(face.altTravMm||100)/1000; // largura da travessa
    if(face.eixo==="lp") return l*p;         // deitada
    if(face.eixo==="lh") return l*a;         // em pé eixo Z (L × A)
    if(face.eixo==="ph") return p*a;         // em pé eixo X (P × A)
  }
  if(face.eixo==="lp") return l*p;
  if(face.eixo==="ph") return p*a;
  return l*a;
}

  const isRolo=matSel&&matSel.tipo==="rolo";
  const metrosLin=f.metrosLin||1;
  const qtdFace=isRolo?metrosLin:area; // rolo usa metros lineares, chapa usa área
  const custo=matSel?custoMat(matSel)*qtdFace:0;
  const esp=f.espMm||15;
  const matOpts='<option value="">— Selecione material —</option>'+
    state.materiais.map(m=>{
      const isRolo=m.tipo==="rolo";
      const unit=isRolo?"/m":"/m²";
      return '<option value="'+m.id+'"'+(String(f.matId)===String(m.id)?' selected':'')+'>'+esc(m.nome)+' ('+fmt(custoMat(m))+unit+')'+(isRolo?' 🎞️':'')+'</option>';
    }).join('');
  const ativo=f.ativoDescricao!==false;
  const isTrav=f.tipo==='travessa'||f.tipo==='prateleira';

  const eixoOpts=isTrav
    ? '<option value="lp"'+(f.eixo==='lp'?' selected':'')+'>Deitada (L × P)</option>'
    + '<option value="lh"'+(f.eixo==='lh'?' selected':'')+'>Em pé — eixo Z (L × A)</option>'
    + '<option value="ph"'+(f.eixo==='ph'?' selected':'')+'>Em pé — eixo X (P × A)</option>'
    : '<option value="lp"'+(f.eixo==='lp'?' selected':'')+'>L × P (Base/Topo)</option>'
    + '<option value="ph"'+(f.eixo==='ph'?' selected':'')+'>P × A (Lateral)</option>'
    + '<option value="lh"'+(f.eixo==='lh'?' selected':'')+'>L × A (Frente/Tras.)</option>';

  const espOpts=
    '<option value="6"' +(esp===6 ?' selected':'')+'>6mm</option>'+
    '<option value="15"'+(esp===15?' selected':'')+'>15mm</option>'+
    '<option value="18"'+(esp===18?' selected':'')+'>18mm</option>'+
    '<option value="25"'+(esp===25?' selected':'')+'>25mm</option>';

  const altTravField=isTrav
    ? '<div><label class="label">ALT. (mm)</label>'
    + '<input type="number" id="alt-trav-'+i+'" value="'+(f.altTravMm||100)+'" min="1" step="1" style="text-align:center"'
    + ' onchange="compData.faces['+i+'].altTravMm=+this.value;atualizarMateriaisDesFaces();atualizarResumoFaces();setTimeout(desenhar3D,80)"'
    + ' oninput="compData.faces['+i+'].altTravMm=+this.value;atualizarMateriaisDesFaces();atualizarResumoFaces();"/></div>'
    : '';

  const roloField=isRolo
    ? '<div><label class="label">METROS LINEARES</label>'
    + '<input type="number" id="rolo-ml-'+i+'" value="'+metrosLin+'" min="0" step="0.1" style="text-align:center"'
    + ' oninput="compData.faces['+i+'].metrosLin=+this.value;atualizarMateriaisDesFaces();atualizarResumoFaces()"/></div>'
    : '';

  const areaLabel=isRolo?(metrosLin.toFixed(2)+" m"):(area.toFixed(4)+" m²");
  const cols='150px 1fr 140px '+(isTrav?'90px ':'')+( isRolo?'90px ':'')+' auto auto auto';

  return '<div id="face-row-'+i+'" style="background:#fff;border:1px solid #eee;border-radius:7px;padding:10px 12px;margin-bottom:8px;">'
    +'<div style="display:grid;grid-template-columns:'+cols+';gap:8px;align-items:end;">'
    +'<div><label class="label">FACE</label>'
    +'<input value="'+esc(f.nome)+'" style="text-transform:uppercase;font-weight:700"'
    +' oninput="this.value=this.value.toUpperCase();compData.faces['+i+'].nome=this.value"/></div>'
    +'<div><label class="label">MATERIAL</label>'
    +'<select onchange="onFaceMatChange('+i+',this.value)">'+matOpts+'</select></div>'
    +'<div><label class="label">POSIÇÃO</label>'
    +'<select onchange="onFaceEixoChange('+i+',this.value)">'+eixoOpts+'</select></div>'
    +altTravField
    +roloField
    +'<div id="face-area-'+i+'" style="font-size:10px;color:#888;white-space:nowrap;padding-bottom:4px">'+areaLabel+'</div>'
    +'<div id="face-custo-'+i+'" style="font-size:11px;color:#2c2c2c;font-weight:700;white-space:nowrap;padding-bottom:4px">'+(custo>0?fmt(custo):'—')+'</div>'

    +'<input type="checkbox" '+(ativo?'checked':'')+' onchange="compData.faces['+i+'].ativoDescricao=this.checked"/>'

function calcCustoFaces(){
  const dim={larg:compData.dimLarg||800,alt:compData.dimAlt||1800,prof:compData.dimProf||600};
  return (compData.faces||[]).reduce((s,f)=>{
    const area=areaFaceComp(f,dim);
    const mat=state.materiais.find(m=>String(m.id)===String(f.matId));
    return s+(mat?custoMat(mat)*area:0);
  },0);
}

function atualizarResumoFaces(){
  // Atualiza área e custo por linha sem recriar DOM
  const dim={larg:compData.dimLarg||800,alt:compData.dimAlt||1800,prof:compData.dimProf||600};
  (compData.faces||[]).forEach((f,i)=>{
    const mat=state.materiais.find(m=>String(m.id)===String(f.matId));
    const isRolo=mat&&mat.tipo==="rolo";
    const qtd=isRolo?(f.metrosLin||1):areaFaceComp(f,dim);
    const custo=mat?custoMat(mat)*qtd:0;
    const aEl=document.getElementById("face-area-"+i);
    const cEl=document.getElementById("face-custo-"+i);
    if(aEl) aEl.textContent=isRolo?(qtd.toFixed(2)+" m"):(qtd.toFixed(4)+" m²");
    if(cEl) cEl.textContent=custo>0?fmt(custo):"—";
  });
  // Total
  const tot=document.getElementById("custo-total-faces");
  if(tot) tot.textContent=fmt(calcCustoFaces());
  // Resumo de consumo
  atualizarTabelaResumo();
}

function atualizarTabelaResumo(){
  const tbody=document.getElementById("resumo-consumo-tbody");
  const totArea=document.getElementById("resumo-total-area");
  const totCusto=document.getElementById("resumo-total-custo");
  if(!tbody) return;
  const dim={larg:compData.dimLarg||800,alt:compData.dimAlt||1800,prof:compData.dimProf||600};
  const faces=compData.faces||[];
  let totalArea=0,totalCusto=0;
  tbody.innerHTML=faces.map(f=>{
    const area=areaFaceComp(f,dim);
    const mat=state.materiais.find(m=>String(m.id)===String(f.matId));
    const custoUnit=mat?custoMat(mat):0;
    const custo=custoUnit*area;
    totalArea+=area; totalCusto+=custo;
    return `<tr>
      <td style="font-weight:600">${esc(f.nome)}</td>
      <td>${mat?esc(mat.nome):`<span style="color:#bbb">Não selecionado</span>`}</td>
      <td style="text-align:right">${area.toFixed(4)}</td>
      <td style="text-align:right">${custoUnit>0?fmt(custoUnit)+" /m²":"—"}</td>
      <td style="text-align:right;font-weight:700;color:${custo>0?"#2c2c2c":"#bbb"}">${custo>0?fmt(custo):"—"}</td>
    </tr>`;
  }).join("");
  if(totArea) totArea.textContent=totalArea.toFixed(4);
  if(totCusto) totCusto.textContent=fmt(totalCusto);
}

function atualizarMateriaisDesFaces(){
  if(!compData.faces) return;
  const dim={larg:compData.dimLarg||800,alt:compData.dimAlt||1800,prof:compData.dimProf||600};
  const agrupado={};
  compData.faces.forEach(f=>{
    if(!f.matId) return;
    const key=String(f.matId);
    const mat=state.materiais.find(m=>String(m.id)===key);
    const isRolo=mat&&mat.tipo==="rolo";
    const qtd=isRolo?(f.metrosLin||1):areaFaceComp(f,dim);
    if(!agrupado[key]) agrupado[key]={matId:f.matId,qtd:0,ativoDescricao:f.ativoDescricao};
    agrupado[key].qtd+=qtd;
  });
  compData.materiais=Object.values(agrupado);
}
function adicionarFaceComp(){

function adicionarFacePreset(tipo,nome,eixo,espMm){
  document.getElementById("menu-add-face")?.remove();
  if(!compData.faces) compData.faces=FACES_COMP_PADRAO();
  const id=(compData.faces.length?Math.max(...compData.faces.map(f=>f.id)):0)+1;
  const i=compData.faces.length;
  const face={id,nome,eixo,tipo,espMm,altTravMm:(tipo==="travessa"||tipo==="prateleira")?100:0,matId:"",ativoDescricao:true};
  if(tipo==="custom") face.nome="NOVA FACE";
  compData.faces.push(face);
  const lista=document.getElementById("faces-lista");
  if(lista){
    lista.insertAdjacentHTML("beforeend",renderFaceRow(face,i));
    atualizarResumoFaces();
    setTimeout(desenhar3D,80);
  } else {
    renderTab();setTimeout(desenhar3D,80);
  }
}
function removerFaceComp(i){
  if((compData.faces||[]).length<=1){alert("Mantenha ao menos uma face.");return;}
  compData.faces.splice(i,1);
  atualizarMateriaisDesFaces();
  renderTab();setTimeout(desenhar3D,80);
}

// ── VISUALIZAÇÃO 3D DO MÓVEL (Three.js WebGL) ───────────────────
const COR_LISTA=["#6aaef2","#4ab34a","#f2a84e","#c084f5","#f27070","#70d4d4","#f2e44e","#e87878"];
let _threeCtx=null;

function desenhar3D(){
  const wrap=document.getElementById("movel-3d-wrap");
  const canvas=document.getElementById("movel-3d");
  const legEl=document.getElementById("legenda-3d");
  if(!wrap||!canvas||!compData.faces) return;
  // Legenda
  if(legEl){
    legEl.innerHTML=(compData.faces||[]).map((f,i)=>`
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:${COR_LISTA[i%COR_LISTA.length]};flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.3)"></span>
        <span style="color:#333;font-weight:600">${esc(f.nome)}</span>
        <span style="color:#999;font-size:10px">${f.eixo==="lp"?"L×P (Base/Topo)":f.eixo==="ph"?"P×A (Lateral)":"L×A (Frente/Tras.)"}</span>
      </div>`).join("");
  }
  if(!window.THREE){
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
    s.onload=()=>_initThree(wrap,canvas);
    document.head.appendChild(s);
  } else {
    _initThree(wrap,canvas);
  }
}

function _initThree(wrap,canvas){
  const THREE=window.THREE;
  // Cancela animação anterior
  if(_threeCtx){cancelAnimationFrame(_threeCtx.animId);_threeCtx.renderer.dispose();}
  const W=wrap.clientWidth||320, H=wrap.clientHeight||320;
  // Dimensões em metros
  const lw=(compData.dimLarg||800)/1000;
  const lh=(compData.dimAlt||1800)/1000;
  const ld=(compData.dimProf||600)/1000;
  const maxD=Math.max(lw,lh,ld)||1;
  // Renderer
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setSize(W,H);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setClearColor(0x1a1a2e,1);renderer.shadowMap.enabled=true;
  // Cena
  const scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0x1a1a2e,maxD*6,maxD*12);
  // Câmera
  const camera=new THREE.PerspectiveCamera(38,W/H,0.001,200);
  // Câmera posicionada na frente e levemente acima, olhando para o centro
  // up=(0,1,0) garante que Y+ fica sempre para cima na tela
  camera.up.set(0,1,0);
  camera.position.set(maxD*1.8, maxD*0.8, maxD*2.5);
  camera.lookAt(0,0,0);
  // Luzes
  scene.add(new THREE.AmbientLight(0xffffff,0.5));
  const d1=new THREE.DirectionalLight(0xffffff,0.9);d1.position.set(3,5,4);d1.castShadow=true;scene.add(d1);
  const d2=new THREE.DirectionalLight(0x8899ff,0.35);d2.position.set(-3,-1,-3);scene.add(d2);
  // Grid no chão — BASE do móvel
  const grid=new THREE.GridHelper(maxD*4,12,0x334466,0x223355);grid.position.y=-lh/2-0.001;scene.add(grid);
  // Pivot — sem rotação X para Y+ ficar sempre para cima
  const pivot=new THREE.Group();pivot.rotation.x=0;pivot.rotation.y=Math.PI/6;scene.add(pivot);

  // Agrupa faces por tipo/eixo
  const fp={lp:[],ph:[],lh:[],travessa:[],prateleira:[]};
  (compData.faces||[]).forEach((f,i)=>{
    const bucket=(f.tipo==="travessa")?"travessa":(f.tipo==="prateleira")?"prateleira":(fp[f.eixo]?f.eixo:"lh");
    fp[bucket].push({...f,cor:COR_LISTA[i%COR_LISTA.length]});
  });
  const x=lw/2,y=lh/2,z=ld/2;

  // Cria plano simples sem espessura
  function mkPanel(cx,cy,cz,sw,sh,sd,cor,op){
    // Determina qual dimensão é a "espessura" (menor) para criar o plano correto
    let geo;
    if(sd<sw&&sd<sh)      geo=new THREE.PlaneGeometry(sw,sh); // plano XY
    else if(sw<sh&&sw<sd) geo=new THREE.PlaneGeometry(sd,sh); // plano YZ
    else                  geo=new THREE.PlaneGeometry(sw,sd); // plano XZ

    const mat=new THREE.MeshPhongMaterial({color:new THREE.Color(cor),transparent:op<1,opacity:op,side:THREE.DoubleSide,shininess:60});
    const mesh=new THREE.Mesh(geo,mat);

    // Rotaciona o plano para alinhar com o eixo correto
    if(sd<sw&&sd<sh){
      // já no plano XY, sem rotação
    } else if(sw<sh&&sw<sd){
      mesh.rotation.y=Math.PI/2; // plano YZ
    } else {
      mesh.rotation.x=Math.PI/2; // plano XZ (horizontal)
    }
    mesh.position.set(cx,cy,cz);
    pivot.add(mesh);

    // Borda fina
    const edge=new THREE.EdgesGeometry(geo);
    const line=new THREE.LineSegments(edge,new THREE.LineBasicMaterial({color:0xffffff,opacity:0.3,transparent:true}));
    line.rotation.copy(mesh.rotation);
    line.position.set(cx,cy,cz);
    pivot.add(line);
  }

  const THIN=0.001; // espessura visual mínima para identificar o plano
  const lps=fp.lp,phs=fp.ph,lhs=fp.lh;
  if(lps[0]) mkPanel(0,-y,0, lw,THIN,ld, lps[0].cor,0.92); // BASE
  if(lps[1]) mkPanel(0, y,0, lw,THIN,ld, lps[1].cor,0.92); // TOPO
  if(phs[0]) mkPanel(-x,0,0, THIN,lh,ld, phs[0].cor,0.88); // LAT ESQ
  if(phs[1]) mkPanel( x,0,0, THIN,lh,ld, phs[1].cor,0.88); // LAT DIR
  if(lhs[0]) mkPanel(0,0, z, lw,lh,THIN, lhs[0].cor,0.92); // FRENTE
  if(lhs[1]) mkPanel(0,0,-z, lw,lh,THIN, lhs[1].cor,0.65); // TRASEIRA
  lhs.slice(2).forEach((f,i)=>mkPanel(0,0,z*(0.3+i*0.15),lw,lh,THIN,f.cor,0.4));
  fp.travessa.forEach((f,i)=>{
    const yPos=-y+lh*(0.3+i*0.25);
    if(f.eixo==='lp')      mkPanel(0,yPos,0,  lw,THIN,ld,   f.cor,0.88);
    else if(f.eixo==='lh') mkPanel(0,0,z*0.1*i, lw,lh,THIN, f.cor,0.88);
    else                   mkPanel(x*0.3*i,0,0, THIN,lh,ld,  f.cor,0.88);
  });
  fp.prateleira.forEach((f,i)=>{
    const yPos=-y+lh*(0.5+i*0.2);
    if(f.eixo==='lp')      mkPanel(0,yPos,0,  lw,THIN,ld,   f.cor,0.88);
    else if(f.eixo==='lh') mkPanel(0,0,z*0.1*i, lw,lh,THIN, f.cor,0.88);
    else                   mkPanel(x*0.3*i,0,0, THIN,lh,ld,  f.cor,0.88);
  });

  // Controles — rotação só no eixo Y ao arrastar horizontalmente
  // rx limitado para não inverter o modelo
  let drag=false,px=0,py=0,rx=0,ry=Math.PI/6;
  canvas.style.cursor="grab";
  canvas.onmousedown=e=>{drag=true;px=e.clientX;py=e.clientY;canvas.style.cursor="grabbing";};
  canvas.onmousemove=e=>{
    if(!drag)return;
    ry+=(e.clientX-px)*0.008;
    rx+=(e.clientY-py)*0.006;
    rx=Math.max(-0.8,Math.min(0.8,rx)); // limita para não virar de cabeça pra baixo
    pivot.rotation.y=ry;pivot.rotation.x=rx;
    px=e.clientX;py=e.clientY;
  };
  canvas.onmouseup=canvas.onmouseleave=()=>{drag=false;canvas.style.cursor="grab";};
  canvas.onwheel=e=>{e.preventDefault();camera.position.multiplyScalar(1+e.deltaY*0.001);};
  let tx=0,ty=0;
  canvas.ontouchstart=e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;};
  canvas.ontouchmove=e=>{
    e.preventDefault();
    ry+=(e.touches[0].clientX-tx)*0.008;
    rx+=(e.touches[0].clientY-ty)*0.006;
    rx=Math.max(-0.8,Math.min(0.8,rx));
    pivot.rotation.y=ry;pivot.rotation.x=rx;
    tx=e.touches[0].clientX;ty=e.touches[0].clientY;
  };

  // Botão reset vista isométrica
  const btnReset=wrap.querySelector(".btn-reset-iso")||document.createElement("button");
  btnReset.className="btn-reset-iso";
  btnReset.textContent="⟳ ISO";
  btnReset.style.cssText="position:absolute;top:8px;right:8px;background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:5px;padding:4px 10px;font-size:11px;cursor:pointer;font-weight:600;letter-spacing:.5px;";
  btnReset.onmousedown=e=>e.stopPropagation();
  btnReset.onclick=()=>{rx=0;ry=Math.PI/6;pivot.rotation.x=0;pivot.rotation.y=Math.PI/6;camera.position.set(maxD*1.8,maxD*0.8,maxD*2.5);camera.lookAt(0,0,0);};
  if(!wrap.querySelector(".btn-reset-iso")) wrap.appendChild(btnReset);

  // Loop de animação
  let animId;
  (function animate(){animId=requestAnimationFrame(animate);renderer.render(scene,camera);})();
  _threeCtx={renderer,animId};
}

const FACES_PADRAO = [
  {nome:"Base",        eixo:"lp"}, // largura × profundidade
  {nome:"Topo",        eixo:"lp"},
  {nome:"Lateral Esq", eixo:"ph"}, // profundidade × altura
  {nome:"Lateral Dir", eixo:"ph"},
  {nome:"Traseira",    eixo:"lh"}, // largura × altura
  {nome:"Porta",       eixo:"lh"}
];

let calcFaces=[];
let calcDim={larg:800,alt:1800,prof:600};

function iniciarCalc(){
  if(!calcFaces.length){
    calcFaces=FACES_PADRAO.map((f,i)=>({id:i+1,nome:f.nome,eixo:f.eixo,matId:"",ativo:true}));
  }
}

function areaFace(face,dim){
  const l=dim.larg/1000, a=dim.alt/1000, p=dim.prof/1000;
  if(face.eixo==="lp") return l*p;
  if(face.eixo==="ph") return p*a;
  if(face.eixo==="lh") return l*a;
  return (face.largCm||0)/100 * (face.altCm||0)/100;
}

function calcularResultado(){
  const dim=calcDim;
  const mats=state.materiais;
  return calcFaces.filter(f=>f.ativo).map(f=>{
    const area=areaFace(f,dim);
    const mat=mats.find(m=>String(m.id)===String(f.matId));
    const custoUnit=mat?custoMat(mat):0;
    const custo=custoUnit*area;
    return{...f,area,mat,custoUnit,custo};
  });
}

}

  ${state.users.map((u,i)=>{const s=setorInfo(u.setor);return`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:${i%2===0?"transparent":"#f7f7f7"};border-radius:8px;margin-bottom:4px">
    <div class="flex">
      <div style="width:36px;height:36px;border-radius:50%;background:#ebebeb;border:2px solid ${s.cor};display:flex;align-items:center;justify-content:center;font-weight:800;color:${s.cor};font-size:15px">${u.nome[0].toUpperCase()}</div>
      <div><div style="font-weight:700;font-size:13px">${esc(u.nome)}</div><div style="font-size:10px;color:${T.muted}">@${esc(u.login)} · <span style="color:${s.cor}">${s.nome}</span></div></div>
    </div>
    <div class="flex">${u.id!==currentUser.id?`<button class="btn-icon" onclick="editUser(${u.id})">✏</button><button class="btn-icon danger" onclick="delUser(${u.id})">✕</button>`:`<span style="font-size:10px;color:${T.muted}">você</span>`}</div>
  </div>`;}).join("")}</div></div>`;
}
function saveUser(){const nome=ge("u-nome").value.trim().toUpperCase(),login=ge("u-login").value.trim(),senha=ge("u-senha").value,setor=ge("u-setor").value;if(!nome||!login||(!userEditId&&!senha))return;if(userEditId){state.users=state.users.map(u=>u.id===userEditId?{...u,nome,login,setor,senha:senha||u.senha}:u);userEditId=null;}else{if(state.users.find(u=>u.login===login)){alert("Login já existe.");return;}state.users.push({id:genId(),nome,login,senha,setor});}save();renderTab();}
function editUser(id){userEditId=id;renderTab();}
function cancelUserEdit(){userEditId=null;renderTab();}
function delUser(id){if(id===currentUser.id)return;if(confirm("Excluir?"))state.users=state.users.filter(u=>u.id!==id);save();renderTab();}
